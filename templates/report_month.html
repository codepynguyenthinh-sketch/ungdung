<!-- Báo cáo tháng -->
<div id="report-month" class="tab-content">
    <h2 class="section-title">
        <i class="fas fa-chart-bar"></i> Báo cáo lượt truy cập theo khoa/viện
    </h2>
    <div class="form-container">
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <div class="form-group" style="flex: 1;">
                <label>Từ ngày</label>
                <input type="date" id="report-from-date" class="form-control">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Đến ngày</label>
                <input type="date" id="report-to-date" class="form-control">
            </div>
            <div class="form-group" style="align-self: flex-end;">
                <button onclick="loadKhoaVienReportRange()" class="btn btn-primary">
                    <i class="fas fa-search"></i> Xem báo cáo
                </button>
                <button class="btn btn-success" onclick="exportKhoaVienExcel()">
                    <i class="fas fa-file-excel"></i> Xuất Excel
                </button>
                <button class="btn btn-danger" onclick="printKhoaVienPDF()">
                    <i class="fas fa-file-pdf"></i> Xuất PDF / In
                </button>
            </div>
        </div>
        <div class="table-container mt-3">
            <table id="khoa-vien-report-month-table" class="user-table">
                <thead>
                    <tr>
                        <th>Khoa/Viện</th>
                        <th>Lượt truy cập</th>
                        <th>Trung bình/ngày</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function loadKhoaVienReportRange() {
    const fromDate = document.getElementById('report-from-date').value;
    const toDate = document.getElementById('report-to-date').value;
    if (!fromDate || !toDate) {
        if (typeof Swal !== 'undefined') {
            Swal.fire('Thông báo', 'Vui lòng chọn ngày bắt đầu và ngày kết thúc', 'warning');
        } else {
            alert('Vui lòng chọn ngày bắt đầu và ngày kết thúc');
        }
        return;
    }
    try {
        const response = await fetch(`/api/report/khoa_vien_range?from=${fromDate}&to=${toDate}`);
        if (!response.ok) throw new Error('Lỗi khi tải báo cáo');
        const data = await response.json();
        const tbody = document.querySelector('#khoa-vien-report-month-table tbody');
        tbody.innerHTML = '';

        const from = new Date(fromDate);
        const to = new Date(toDate);
        const days = Math.max(1, Math.ceil((to - from) / (1000 * 60 * 60 * 24)) + 1);

        let totalLuot = 0;
        data.forEach(item => {
            totalLuot += item.so_luot;
            const tr = document.createElement('tr');
            const avg = (item.so_luot / days).toFixed(1);
            tr.innerHTML = `<td>${item.khoa_vien}</td><td>${item.so_luot}</td><td>${avg}</td>`;
            tbody.appendChild(tr);
        });

        const totalAvg = (totalLuot / days).toFixed(1);
        const trTotal = document.createElement('tr');
        trTotal.style.fontWeight = 'bold';
        trTotal.style.backgroundColor = '#203255';
        trTotal.style.color = '#fff';
        trTotal.innerHTML = `<td>Tổng cộng</td><td>${totalLuot}</td><td>${totalAvg}</td>`;
        tbody.appendChild(trTotal);
    } catch (error) {
        console.error('Error loading report:', error);
        if (typeof Swal !== 'undefined') {
            Swal.fire('Lỗi', error.message, 'error');
        } else {
            alert('Lỗi: ' + error.message);
        }
    }
}

function exportKhoaVienExcel() {
    const fromDate = document.getElementById('report-from-date').value;
    const toDate = document.getElementById('report-to-date').value;
    if (!fromDate || !toDate) {
        if (typeof Swal !== 'undefined') {
            Swal.fire('Thông báo', 'Vui lòng chọn khoảng thời gian và xem báo cáo trước khi xuất Excel', 'warning');
        } else {
            alert('Vui lòng chọn khoảng thời gian và xem báo cáo trước khi xuất Excel');
        }
        return;
    }
    const table = document.getElementById('khoa-vien-report-month-table');
    const rows = table.querySelectorAll('tr');
    if (rows.length <= 1) {
        if (typeof Swal !== 'undefined') {
            Swal.fire('Thông báo', 'Chưa có dữ liệu để xuất. Vui lòng xem báo cáo trước.', 'warning');
        } else {
            alert('Chưa có dữ liệu để xuất. Vui lòng xem báo cáo trước.');
        }
        return;
    }

    // Tạo tiêu đề báo cáo theo khoảng thời gian
    const from = new Date(fromDate);
    const to = new Date(toDate);
    const fromMonth = from.getMonth() + 1;
    const fromYear = from.getFullYear();
    const toMonth = to.getMonth() + 1;
    const toYear = to.getFullYear();

    let reportTitle;
    if (fromMonth === toMonth && fromYear === toYear) {
        reportTitle = `BÁO CÁO THÁNG ${fromMonth}/${fromYear}`;
    } else {
        reportTitle = `BÁO CÁO TỪ THÁNG ${fromMonth}/${fromYear} ĐẾN THÁNG ${toMonth}/${toYear}`;
    }

    let csv = '\uFEFF';

    // Header văn bản báo cáo
    csv += '"TRƯỜNG ĐẠI HỌC CÔNG NGHIỆP TPHCM","",""\n';
    csv += '"TRUNG TÂM THƯ VIỆN","",""\n';
    csv += '"","",""\n';
    csv += `"${reportTitle}","",""\n`;
    csv += `"Từ ngày: ${fromDate}  –  Đến ngày: ${toDate}","",""\n`;
    csv += '"","",""\n';

    // Dữ liệu bảng
    rows.forEach(row => {
        const cols = row.querySelectorAll('th, td');
        const rowData = Array.from(cols).map(col => '"' + col.textContent.replace(/"/g, '""') + '"');
        csv += rowData.join(',') + '\n';
    });

    // Ghi chú ngày xuất
    const today = new Date();
    const dateStr = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
    csv += '"","",""\n';
    csv += `"","","Ngày xuất báo cáo: ${dateStr}"\n`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `bao_cao_khoa_vien_${fromDate}_${toDate}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
}
