services:
  - type: web
    name: library-management
    runtime: node
    buildCommand: npm run render-build
    startCommand: NODE_ENV=production node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString

databases:
  - name: library-db
    plan: free
    databaseName: library_db
